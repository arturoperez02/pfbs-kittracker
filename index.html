<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>TechSched Pro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
:root{--brand:#1d9e75;--brand-dark:#0f6e56;--brand-light:#e1f5ee;--danger-bg:#FCEBEB;--danger-text:#A32D2D;--warn-bg:#FAEEDA;--warn-text:#854F0B;--info-bg:#E6F1FB;--info-text:#185FA5;--bg:#f5f5f3;--surface:#ffffff;--text:#1a1a1a;--text-muted:#6b7280;--border:rgba(0,0,0,0.1);--border-strong:rgba(0,0,0,0.2);--radius:12px;--radius-sm:8px;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);font-size:14px;min-height:100vh;max-width:480px;margin:0 auto;}
.hidden{display:none!important;}
.screen{display:none;padding:12px;padding-bottom:80px;}
.screen.active{display:block;}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 10px;background:var(--surface);border-bottom:0.5px solid var(--border);position:sticky;top:0;z-index:100;}
.topbar-title{font-size:16px;font-weight:600;font-family:'Space Mono',monospace;}
.nav{display:flex;background:var(--surface);border-top:0.5px solid var(--border);position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;z-index:200;}
.nav-btn{flex:1;padding:10px 4px 8px;text-align:center;cursor:pointer;border:none;background:none;color:var(--text-muted);font-family:'DM Sans',sans-serif;font-size:10px;font-weight:500;display:flex;flex-direction:column;align-items:center;gap:3px;transition:color 0.15s;position:relative;}
.nav-btn i{font-size:22px;}
.nav-btn.active{color:var(--brand);}
.nav-badge{position:absolute;top:6px;right:calc(50% - 18px);background:#E24B4A;color:white;font-size:9px;font-weight:700;min-width:16px;height:16px;border-radius:999px;display:flex;align-items:center;justify-content:center;padding:0 4px;}
.card{background:var(--surface);border:0.5px solid var(--border);border-radius:var(--radius);padding:13px 15px;margin-bottom:10px;}
.card-green{border-left:3px solid var(--brand);border-radius:0 var(--radius) var(--radius) 0;}
.card-red{border-left:3px solid #E24B4A;border-radius:0 var(--radius) var(--radius) 0;}
.card-amber{border-left:3px solid #EF9F27;border-radius:0 var(--radius) var(--radius) 0;}
.card-blue{border-left:3px solid #378ADD;border-radius:0 var(--radius) var(--radius) 0;}
.card-done{border-left:3px solid #9ca3af;border-radius:0 var(--radius) var(--radius) 0;opacity:0.65;}
.badge{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:600;padding:3px 8px;border-radius:6px;}
.badge-danger{background:var(--danger-bg);color:var(--danger-text);}
.badge-warn{background:var(--warn-bg);color:var(--warn-text);}
.badge-success{background:var(--brand-light);color:var(--brand-dark);}
.badge-info{background:var(--info-bg);color:var(--info-text);}
.badge-done{background:#f3f4f6;color:#6b7280;}
/* NEW: Status badges */
.badge-scheduled{background:#E6F1FB;color:#185FA5;}
.badge-inprogress{background:#FAEEDA;color:#854F0B;}
.badge-complete{background:var(--brand-light);color:var(--brand-dark);}
.btn{padding:9px 16px;border-radius:var(--radius-sm);border:0.5px solid var(--border-strong);background:none;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;cursor:pointer;color:var(--text);transition:background 0.15s;display:inline-flex;align-items:center;gap:6px;}
.btn:hover{background:var(--bg);}
.btn:active{transform:scale(0.98);}
.btn-primary{background:var(--brand);color:white;border-color:var(--brand);}
.btn-primary:hover{background:var(--brand-dark);}
.btn-danger{color:var(--danger-text);border-color:#F09595;}
.btn-danger:hover{background:var(--danger-bg);}
.btn-done{background:#f3f4f6;color:#6b7280;border-color:#e5e7eb;}
.btn-sm{padding:6px 12px;font-size:12px;}
.btn-xs{padding:4px 9px;font-size:11px;}
.btn-warn{background:var(--warn-bg);color:var(--warn-text);border-color:#FAC775;}
.section-label{font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.08em;padding:10px 0 6px;}
.form-group{margin-bottom:13px;}
.form-label{font-size:12px;color:var(--text-muted);margin-bottom:5px;display:block;font-weight:500;}
input,select,textarea{width:100%;padding:10px 12px;border:0.5px solid var(--border-strong);border-radius:var(--radius-sm);font-family:'DM Sans',sans-serif;font-size:14px;background:var(--surface);color:var(--text);outline:none;transition:border-color 0.15s;}
input:focus,select:focus,textarea:focus{border-color:var(--brand);}
textarea{resize:vertical;min-height:60px;}
.conflict-alert{background:var(--danger-bg);border:0.5px solid #F09595;border-radius:var(--radius);padding:11px 13px;margin-bottom:10px;}
.conflict-title{font-size:13px;font-weight:600;color:var(--danger-text);margin-bottom:5px;display:flex;align-items:center;gap:5px;}
.conflict-body{font-size:12px;color:#A32D2D;line-height:1.6;}
.reminder-banner{background:var(--warn-bg);border:0.5px solid #FAC775;border-radius:var(--radius);padding:11px 13px;margin-bottom:10px;}
.reminder-title{font-size:13px;font-weight:600;color:var(--warn-text);margin-bottom:8px;display:flex;align-items:center;gap:5px;}
.reminder-item{font-size:12px;color:var(--warn-text);padding:6px 0;border-bottom:0.5px solid rgba(239,159,39,0.25);display:flex;align-items:center;justify-content:space-between;gap:8px;line-height:1.5;}
.reminder-item:last-child{border-bottom:none;}
/* CALENDAR */
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.cal-month{font-size:15px;font-weight:600;font-family:'Space Mono',monospace;}
.cal-nav-btn{background:var(--surface);border:0.5px solid var(--border-strong);border-radius:var(--radius-sm);padding:5px 11px;cursor:pointer;font-size:18px;color:var(--text);}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:10px;}
.cal-day-label{text-align:center;font-size:10px;color:var(--text-muted);padding:4px 0;font-weight:600;}
.cal-cell{min-height:58px;background:var(--surface);border:0.5px solid var(--border);border-radius:7px;padding:3px;cursor:pointer;transition:background 0.1s;overflow:hidden;}
.cal-cell:hover{background:var(--brand-light);}
.cal-cell.today{border-color:var(--brand);border-width:1.5px;}
.cal-cell.other-month{opacity:0.3;}
.cal-cell.selected{background:var(--brand-light);border-color:var(--brand);}
.cal-num{font-size:11px;font-weight:600;color:var(--text-muted);margin-bottom:2px;}
.cal-cell.today .cal-num{color:var(--brand);}
.cal-tech-row{display:flex;flex-wrap:wrap;gap:1px;margin-top:1px;}
.cal-tech-pip{font-size:8px;font-weight:700;padding:1px 3px;border-radius:3px;background:var(--brand-light);color:var(--brand-dark);line-height:1.4;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.cal-tech-pip.pip-conflict{background:var(--danger-bg);color:var(--danger-text);}
.cal-tech-pip.pip-done{background:#f3f4f6;color:#9ca3af;}
.cal-tech-pip.pip-equip{background:var(--info-bg);color:var(--info-text);}
.view-toggle{display:flex;background:var(--bg);border:0.5px solid var(--border);border-radius:var(--radius-sm);padding:3px;margin-bottom:10px;}
.vt-btn{flex:1;text-align:center;padding:7px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;color:var(--text-muted);border:none;background:none;font-family:'DM Sans',sans-serif;transition:all 0.15s;display:flex;align-items:center;justify-content:center;gap:5px;}
.vt-btn.active{background:var(--surface);color:var(--text);border:0.5px solid var(--border);}
.day-header{font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.08em;padding:12px 0 7px;border-bottom:0.5px solid var(--border);margin-bottom:9px;}
.job-time{font-size:15px;font-weight:600;margin-bottom:3px;}
.job-address{font-size:13px;color:var(--text-muted);margin-bottom:6px;line-height:1.4;}
.job-type-pill{display:inline-block;font-size:11px;font-weight:600;padding:3px 9px;border-radius:6px;background:var(--brand-light);color:var(--brand-dark);margin-bottom:5px;}
.job-notes{font-size:12px;color:var(--text-muted);background:var(--bg);border-radius:var(--radius-sm);padding:7px 9px;margin-top:6px;line-height:1.5;}
.admin-notes{font-size:12px;color:#854F0B;background:var(--warn-bg);border:0.5px solid #FAC775;border-radius:var(--radius-sm);padding:7px 9px;margin-top:6px;line-height:1.5;}
.equip-box{background:var(--info-bg);border:0.5px solid #B5D4F4;border-radius:var(--radius);padding:11px 13px;margin-top:10px;}
.equip-box-title{font-size:12px;font-weight:600;color:var(--info-text);margin-bottom:7px;display:flex;align-items:center;gap:5px;}
.equip-tag{display:inline-flex;align-items:center;gap:4px;background:white;color:var(--info-text);font-size:11px;font-weight:600;padding:3px 9px;border-radius:6px;margin:2px;border:0.5px solid #B5D4F4;}
.equip-row{font-size:12px;color:var(--info-text);margin-bottom:4px;display:flex;align-items:center;gap:5px;}
.gcal-btn{display:inline-flex;align-items:center;gap:7px;background:white;border:0.5px solid #B5D4F4;border-radius:var(--radius-sm);padding:7px 13px;font-size:12px;font-weight:600;color:var(--info-text);cursor:pointer;font-family:'DM Sans',sans-serif;margin-top:8px;text-decoration:none;}
.equip-checks{display:flex;flex-wrap:wrap;gap:7px;margin-top:6px;}
.equip-check-item{display:flex;align-items:center;gap:7px;background:var(--bg);border:0.5px solid var(--border-strong);border-radius:var(--radius-sm);padding:8px 12px;cursor:pointer;transition:all 0.15s;user-select:none;}
.equip-check-item.checked{background:var(--info-bg);border-color:#378ADD;}
.equip-check-item input[type=checkbox]{width:15px;height:15px;accent-color:var(--brand);cursor:pointer;}
.equip-check-item label{font-size:13px;cursor:pointer;font-weight:500;}
.chip-scroll{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;margin-bottom:10px;}
.chip-scroll::-webkit-scrollbar{display:none;}
.chip{display:inline-block;padding:6px 14px;border-radius:999px;border:0.5px solid var(--border-strong);font-size:12px;font-weight:500;cursor:pointer;background:var(--surface);color:var(--text-muted);font-family:'DM Sans',sans-serif;white-space:nowrap;transition:all 0.15s;}
.chip.active{background:var(--brand);color:white;border-color:var(--brand);}
.chip.done-chip.active{background:#6b7280;border-color:#6b7280;}
.stat-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
.stat-card{background:var(--surface);border:0.5px solid var(--border);border-radius:var(--radius);padding:13px;}
.stat-val{font-size:26px;font-weight:600;font-family:'Space Mono',monospace;}
.stat-lbl{font-size:12px;color:var(--text-muted);margin-top:3px;}
.empty{text-align:center;padding:56px 20px;color:var(--text-muted);}
.empty i{font-size:40px;margin-bottom:12px;display:block;}
.empty-title{font-size:16px;font-weight:600;color:var(--text);margin-bottom:6px;}
.modal-bg{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);display:none;align-items:flex-end;z-index:500;}
.modal-bg.open{display:flex;}
.modal{background:var(--surface);border-radius:20px 20px 0 0;padding:18px 16px 32px;width:100%;max-height:88vh;overflow-y:auto;}
.modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.modal-title{font-size:17px;font-weight:600;}
.close-btn{background:var(--bg);border:none;width:32px;height:32px;border-radius:50%;font-size:20px;cursor:pointer;color:var(--text-muted);display:flex;align-items:center;justify-content:center;}
.tech-initials{width:42px;height:42px;border-radius:50%;background:var(--brand-light);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:var(--brand-dark);flex-shrink:0;font-family:'Space Mono',monospace;}
.sitemap-link{display:inline-flex;align-items:center;gap:5px;color:var(--info-text);font-size:13px;font-weight:500;margin-top:6px;text-decoration:none;}
.sync-dot{width:8px;height:8px;border-radius:50%;background:var(--brand);display:inline-block;margin-right:5px;animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.4;}}
.loading-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(255,255,255,0.95);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;}
.spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--brand);border-radius:50%;animation:spin 0.8s linear infinite;margin-bottom:12px;}
@keyframes spin{to{transform:rotate(360deg);}}
.tech-tag-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;}
.tech-tag{display:inline-flex;align-items:center;gap:5px;background:var(--brand-light);color:var(--brand-dark);font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;}
.tech-tag-na{background:var(--warn-bg);color:var(--warn-text);}
.tech-selector-list{display:flex;flex-direction:column;gap:6px;margin-top:6px;}
.tech-selector-row{display:flex;align-items:center;gap:8px;}
.tech-selector-row select{flex:1;}
.remove-tech-btn{background:none;border:0.5px solid #F09595;border-radius:var(--radius-sm);padding:8px 10px;cursor:pointer;color:var(--danger-text);font-size:14px;display:flex;align-items:center;flex-shrink:0;}
.add-tech-btn{display:flex;align-items:center;gap:6px;color:var(--brand);font-size:13px;font-weight:600;cursor:pointer;padding:8px 0;background:none;border:none;font-family:'DM Sans',sans-serif;}
/* SEARCH */
.search-bar{display:flex;align-items:center;gap:8px;background:var(--surface);border:0.5px solid var(--border-strong);border-radius:var(--radius-sm);padding:8px 12px;margin-bottom:12px;}
.search-bar i{color:var(--text-muted);font-size:18px;flex-shrink:0;}
.search-bar input{border:none;background:none;padding:0;font-size:14px;color:var(--text);flex:1;outline:none;}
.search-result-label{font-size:11px;color:var(--text-muted);margin-bottom:8px;}
/* WELCOME */
.welcome-screen{min-height:100vh;background:var(--surface);display:flex;flex-direction:column;}
.welcome-header{padding:48px 24px 32px;text-align:center;border-bottom:0.5px solid var(--border);}
.welcome-logo{font-family:'Space Mono',monospace;font-size:22px;font-weight:700;color:var(--brand);margin-bottom:6px;}
.welcome-sub{font-size:13px;color:var(--text-muted);display:flex;align-items:center;justify-content:center;gap:5px;}
.welcome-body{flex:1;display:flex;flex-direction:column;gap:16px;padding:32px 24px;}
.welcome-btn{width:100%;padding:20px;border-radius:var(--radius);border:0.5px solid var(--border-strong);background:var(--bg);font-family:'DM Sans',sans-serif;cursor:pointer;text-align:left;transition:all 0.15s;display:flex;align-items:center;gap:16px;}
.welcome-btn:hover{border-color:var(--brand);background:var(--brand-light);}
.welcome-btn-icon{width:52px;height:52px;border-radius:var(--radius);display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0;}
.welcome-btn-icon-admin{background:#1a1a1a;color:white;}
.welcome-btn-icon-tech{background:var(--brand);color:white;}
.welcome-btn-title{font-size:16px;font-weight:600;margin-bottom:3px;}
.welcome-btn-sub{font-size:12px;color:var(--text-muted);}
/* PIN */
.pin-screen{min-height:100vh;background:var(--surface);display:flex;flex-direction:column;}
.pin-header{padding:16px;border-bottom:0.5px solid var(--border);display:flex;align-items:center;gap:12px;}
.pin-back{background:none;border:none;cursor:pointer;color:var(--text-muted);font-size:22px;padding:4px;display:flex;align-items:center;}
.pin-header-title{font-family:'Space Mono',monospace;font-size:14px;font-weight:700;}
.pin-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 20px;}
.pin-dots{display:flex;gap:14px;margin-bottom:22px;}
.pin-dot{width:15px;height:15px;border-radius:50%;border:2px solid var(--border-strong);background:none;transition:all 0.15s;}
.pin-dot.filled{background:var(--brand);border-color:var(--brand);}
.pin-err{color:var(--danger-text);font-size:13px;height:20px;margin-bottom:10px;font-weight:500;}
.pin-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:230px;}
.pin-key{padding:16px;text-align:center;font-size:20px;font-weight:500;border-radius:var(--radius);border:0.5px solid var(--border-strong);cursor:pointer;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;transition:background 0.1s;}
.pin-key:active{background:var(--brand-light);}
/* TECH SELECT */
.tech-select-screen{min-height:100vh;background:var(--surface);display:flex;flex-direction:column;}
.tech-select-header{padding:16px;border-bottom:0.5px solid var(--border);display:flex;align-items:center;gap:12px;}
.tech-select-title{font-family:'Space Mono',monospace;font-size:14px;font-weight:700;}
.tech-select-body{flex:1;padding:20px 16px;}
.tech-list-item{display:flex;align-items:center;gap:14px;padding:14px 16px;background:var(--surface);border:0.5px solid var(--border);border-radius:var(--radius);margin-bottom:10px;cursor:pointer;transition:all 0.15s;}
.tech-list-item:hover{border-color:var(--brand);background:var(--brand-light);}
.tech-list-item:active{transform:scale(0.98);}
.tech-list-initials{width:46px;height:46px;border-radius:50%;background:var(--brand-light);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;color:var(--brand-dark);flex-shrink:0;font-family:'Space Mono',monospace;}
.tech-list-name{font-size:16px;font-weight:600;}
.tech-list-sub{font-size:12px;color:var(--text-muted);margin-top:2px;}
/* NEW: Status toggle bar */
.status-toggle{display:flex;border:0.5px solid var(--border-strong);border-radius:var(--radius-sm);overflow:hidden;margin-top:4px;}
.status-toggle-btn{flex:1;padding:9px 4px;text-align:center;font-size:12px;font-weight:600;border:none;background:var(--bg);color:var(--text-muted);cursor:pointer;font-family:'DM Sans',sans-serif;transition:all 0.15s;border-right:0.5px solid var(--border-strong);}
.status-toggle-btn:last-child{border-right:none;}
.status-toggle-btn.active-scheduled{background:#E6F1FB;color:#185FA5;}
.status-toggle-btn.active-inprogress{background:var(--warn-bg);color:var(--warn-text);}
.status-toggle-btn.active-complete{background:var(--brand-light);color:var(--brand-dark);}
/* NEW: Job number row */
.jobnum-row{display:flex;gap:8px;align-items:stretch;}
.jobnum-row input{flex:1;}
.jobnum-auto-btn{padding:0 14px;border:0.5px solid var(--border-strong);border-radius:var(--radius-sm);background:var(--bg);font-family:'DM Sans',sans-serif;font-size:12px;font-weight:600;color:var(--brand);cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:5px;}
.jobnum-auto-btn:hover{background:var(--brand-light);}
/* Bigger desktop layout — wider container, larger calendar grid */
@media (min-width:900px){
  body{max-width:1200px;}
  .nav{max-width:1200px;}
  .screen{padding:24px 32px 90px;}
  .topbar{padding:16px 32px 14px;}
  .topbar-title{font-size:20px;}
  .cal-nav-btn{padding:8px 16px;font-size:20px;}
  .cal-month{font-size:24px;}
  .cal-grid{gap:8px;margin-bottom:16px;}
  .cal-day-label{font-size:13px;padding:8px 0;}
  .cal-cell{min-height:130px;padding:10px;border-radius:12px;}
  .cal-num{font-size:16px;margin-bottom:6px;}
  .cal-tech-row{gap:4px;margin-top:4px;}
  .cal-tech-pip{font-size:11px;padding:3px 8px;border-radius:5px;}
  .job-time{font-size:16px;}
  .job-address{font-size:14px;}
}
</style>
</head>
<body>

<div id="loadingOverlay" class="loading-overlay">
  <div class="spinner"></div>
  <div style="font-size:14px;color:var(--text-muted);">Loading TechSched...</div>
</div>

<!-- LOGIN -->
<div id="loginScreen" class="welcome-screen hidden">
  <div class="welcome-header">
    <div class="welcome-logo">TechSched Pro</div>
    <div class="welcome-sub"><span class="sync-dot"></span> Live sync active</div>
  </div>
  <div class="welcome-body">
    <i class="ti ti-shield-lock" style="font-size:40px;color:var(--text-muted);margin-bottom:16px;display:block;text-align:center;"></i>
    <div style="font-size:13px;color:var(--text-muted);text-align:center;margin-bottom:20px;">Sign in to manage the schedule</div>
    <div class="form-group"><label class="form-label">Email</label><input type="email" id="loginEmail" autocomplete="username" style="width:100%;" onkeydown="if(event.key==='Enter')document.getElementById('loginPassword').focus()"></div>

function equipSkillGaps(equipment,techs){
  const needed=new Set();

  const gaps=[];
  needed.forEach(skill=>{if((techs||[]).length&&!(techs||[]).some(t=>(S.techSkills[t]||[]).includes(skill)))gaps.push(skill);});
  return gaps;
}
// NEW: stable color per job/client so the same client always gets the same calendar color
const JOB_COLOR_PALETTE=['#1d9e75','#378ADD','#8B5CF6','#EF9F27','#E24B4A','#0EA5E9','#D946EF','#F59E0B','#059669','#6366F1','#DB2777','#65A30D'];
function hashStr(s){let h=0;for(let i=0;i<s.length;i++){h=(h*31+s.charCodeAt(i))>>>0;}return h;}
function jobColor(j){const key=j.client||j.jobNum||j.address||'x';return JOB_COLOR_PALETTE[hashStr(key)%JOB_COLOR_PALETTE.length];}
function jobLabel(j){if(j.jobNum){const p=j.jobNum.split('-');return p[p.length-1].slice(-6);}return(j.address||'').split(',')[0].slice(0,8);}

const I18N={

function fmt12Lang(t,lang){const s=fmt12(t);return lang==='es'?s.replace('AM','a.m.').replace('PM','p.m.'):s;}

async function loadSettings(){
  try{

function startListeners(){

}

// Data is only fetched from Firestore after a real, authenticated sign-in —
// previously the app subscribed to the jobs collection immediately on load,
// before the PIN was ever checked, so the PIN was a UI gate only and gave
// no real protection to the underlying data.
let listenersStarted=false;
onAuthStateChanged(auth,async user=>{
  if(user){
    S.isAdmin=true;

// HELPERS
function fmt12(t){if(!t)return'';const[h,m]=t.split(':').map(Number);return`${h%12||12}:${String(m).padStart(2,'0')} ${h>=12?'PM':'AM'}`;}
function fmtDate(d){return new Date(d+'T00:00:00').toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});}
function fmtDateLong(d){return new Date(d+'T00:00:00').toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'});}
function todayStr(){return new Date().toISOString().split('T')[0];}
function addDays(d,n){const dt=new Date(d+'T00:00:00');dt.setDate(dt.getDate()+n);return dt.toISOString().split('T')[0];}
function daysUntil(d){return Math.round((new Date(d+'T00:00:00')-new Date(todayStr()+'T00:00:00'))/(1000*60*60*24));}
function allEquip(){return[...EQUIP_DEFAULT,...S.customEquipList];}
function getTechs(job){return job.techs||([job.lead,job.second].filter(t=>t&&t!=='N/A'));}
function isDone(job){return job.jobStatus==='complete'||job.status==='complete';}

// CONFLICTS
function toMins(t){if(!t)return 0;const[h,m]=t.split(':').map(Number);return h*60+m;}
function timesOverlap(s1,e1,s2,e2){return toMins(s1)<toMins(e2)&&toMins(s2)<toMins(e1);}
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function dateRange(start,end){const out=[],s=new Date(start+'T00:00:00'),e=new Date((end||start)+'T00:00:00');if(isNaN(s)||isNaN(e)||e<s)return[start];for(let d=new Date(s);d<=e;d.setDate(d.getDate()+1))out.push(ymd(d));return out;}
function buildConflictMap(excludeId){const map={};S.jobs.forEach(j=>{if(j.id===excludeId||isDone(j))return;const days=dateRange(j.date,j.endDate);getTechs(j).forEach(t=>{days.forEach(dt=>{const k='T__'+dt+'__'+t;if(!map[k])map[k]=[];map[k].push(j);});});if(j.vehicle){days.forEach(dt=>{const k='V__'+dt+'__'+j.vehicle;if(!map[k])map[k]=[];map[k].push(j);});}});return map;}
function jobConflicts(j,excludeId){const map=buildConflictMap(excludeId||null),issues=[],seen=new Set(),days=dateRange(j.date,j.endDate||j.date);getTechs(j).forEach(t=>{days.forEach(dt=>{const k='T__'+dt+'__'+t;if(map[k]&&map[k].length)map[k].forEach(o=>{if(o.id&&o.id===j.id)return;if(timesOverlap(j.start,j.end,o.start,o.end)){const msg=`${t} already has: ${fmt12(o.start)}–${fmt12(o.end)} at ${o.address.split(',')[0]}`;if(!seen.has(msg)){seen.add(msg);issues.push(msg);}}});});});if(j.vehicle){days.forEach(dt=>{const k='V__'+dt+'__'+j.vehicle;if(map[k]&&map[k].length)map[k].forEach(o=>{if(o.id&&o.id===j.id)return;if(timesOverlap(j.start,j.end,o.start,o.end)){const msg=`${j.vehicle} already booked: ${fmt12(o.start)}–${fmt12(o.end)} at ${o.address.split(',')[0]}`;if(!seen.has(msg)){seen.add(msg);issues.push(msg);}}});});}return issues;}
function isConflicted(j){return!isDone(j)&&jobConflicts(j,j.id).length>0;}

function updateEquipBadge(){const urgent=S.jobs.filter(j=>{if(!j.equipment||!j.equipment.length||isDone(j))return false;const d=daysUntil(j.date);return d>=0&&d<=7;}).length;const badge=document.getElementById('equipBadge');if(!badge)return;if(urgent>0){badge.textContent=urgent;badge.classList.remove('hidden');}else badge.classList.add('hidden');}

function statusBadge(job){
  const js=job.jobStatus||'scheduled';
  if(js==='complete'||job.status==='complete')return`<span class="badge badge-done"><i class="ti ti-check"></i> Complete</span>`;
  if(js==='inprogress')return`<span class="badge badge-warn"><i class="ti ti-player-play"></i> In Progress</span>`;
  return`<span class="badge badge-scheduled"><i class="ti ti-clock"></i> Scheduled</span>`;
}

function renderCalendar(conflictCount){
  const y=S.calYear,m=S.calMonth,first=new Date(y,m,1).getDay(),dim=new Date(y,m+1,0).getDate(),today=todayStr();
  const jobMap={};
  S.jobs.forEach(j=>{
    const start=j.date;
    const end=j.endDate&&j.endDate>=start?j.endDate:start;
    let cur=new Date(start+'T00:00:00');
    const endDt=new Date(end+'T00:00:00');
    while(cur<=endDt){
      const ds=cur.toISOString().split('T')[0];
      if(!jobMap[ds])jobMap[ds]=[];
      if(!jobMap[ds].find(x=>x.id===j.id))jobMap[ds].push(j);
      cur.setDate(cur.getDate()+1);
    }
  });

  let cal=`<div class="cal-nav"><button class="cal-nav-btn" onclick="calPrev()">‹</button><div class="cal-month">${MONTHS[m]} ${y}</div><button class="cal-nav-btn" onclick="calNext()">›</button></div><div class="cal-grid">`;
  DAYS_S.forEach(d=>{cal+=`<div class="cal-day-label">${d}</div>`;});
  const prev=new Date(y,m,0).getDate();
  for(let i=0;i<first;i++)cal+=`<div class="cal-cell other-month"><div class="cal-num">${prev-first+i+1}</div></div>`;

  for(let d=1;d<=dim;d++){
    const ds=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const dayJobs=jobMap[ds]||[];
    const filtered=S.filterTech==='all'?dayJobs:dayJobs.filter(j=>getTechs(j).includes(S.filterTech));
    let pipHtml='';
    filtered.slice(0,6).forEach(j=>{
      const techs=getTechs(j),tbdNow=techs.length===0,color=jobColor(j),label=jobLabel(j)||'JOB';
      let extra='';
      if(isDone(j))extra='opacity:0.4;filter:grayscale(70%);';
      if(isConflicted(j))extra+='box-shadow:0 0 0 1.5px var(--danger-text) inset;';
      const style=`background:${color}22;color:${color};border:1px solid ${color}66;${extra}`;
      pipHtml+=`<span class="cal-tech-pip" style="${style}" title="${(j.client||j.address||'').replace(/"/g,'&quot;')}">${tbdNow?'<i class="ti ti-alert-triangle" style="font-size:8px;"></i> ':''}${label}</span>`;
    });
    if(filtered.length>6)pipHtml+=`<span class="cal-tech-pip" style="background:var(--bg);color:var(--text-muted);">+${filtered.length-6}</span>`;
    cal+=`<div class="cal-cell${ds===today?' today':''}${ds===S.selectedDate?' selected':''}" onclick="selectDay('${ds}')">
      <div class="cal-num">${d}</div>
      <div class="cal-tech-row">${pipHtml}</div>
    </div>`;
  }

  const rem=(7-(first+dim)%7)%7;for(let i=1;i<=rem;i++)cal+=`<div class="cal-cell other-month"><div class="cal-num">${i}</div></div>`;
  cal+='</div>';

  cal+=`<div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px;font-size:11px;color:var(--text-muted);">
    <span>Color = job/client</span>
    <span><i class="ti ti-alert-triangle" style="font-size:10px;"></i> No tech assigned</span>
    <span><span style="display:inline-block;width:10px;height:10px;border-radius:2px;border:1.5px solid var(--danger-text);margin-right:3px;"></span>Conflict</span>
    <span><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:#f3f4f6;margin-right:3px;"></span>Faded = Done</span>
  </div>`;

  if(conflictCount>0)cal+=`<div class="conflict-alert" style="margin-bottom:8px;"><div class="conflict-title"><i class="ti ti-alert-triangle"></i> ${conflictCount} conflict${conflictCount>1?'s':''} detected</div><div class="conflict-body">Check jobs marked in red.</div></div>`;
  document.getElementById('calArea').innerHTML=cal;

  if(S.selectedDate){
    const dayJ=jobMap[S.selectedDate]||[];
    let filt=S.filterTech==='all'?dayJ:dayJ.filter(j=>getTechs(j).includes(S.filterTech));
    // Show ALL jobs on selected day (past and present) — don't filter by done status
    let dh=`<div class="day-header">${fmtDateLong(S.selectedDate)} · ${filt.length} job${filt.length!==1?'s':''}</div>`;
    if(!filt.length)dh+=`<div style="text-align:center;padding:20px;color:var(--text-muted);font-size:13px;">No jobs on this day.</div>`;
    filt.forEach(j=>{ try{ dh+=jobCard(j,S.selectedDate); }catch(e){ console.error('Skipped a malformed job card:',j.id,e); } });
    document.getElementById('jobsArea').innerHTML=dh;
  }else{
    document.getElementById('jobsArea').innerHTML=fullJobsListHtml(conflictCount);
  }
}

function fullJobsListHtml(conflictCount){
  let jobs=[...S.jobs];
  if(S.filterTech!=='all')jobs=jobs.filter(j=>getTechs(j).includes(S.filterTech));
  if(S.filterStatus==='done')jobs=jobs.filter(j=>isDone(j));else jobs=jobs.filter(j=>!isDone(j));

  if(!jobs.length){
    let html='';
    if(conflictCount>0&&S.filterStatus!=='done')html+=`<div class="conflict-alert" style="margin-bottom:8px;"><div class="conflict-title"><i class="ti ti-alert-triangle"></i> ${conflictCount} conflict${conflictCount>1?'s':''}</div><div class="conflict-body">Double-booked technicians detected.</div></div>`;
    html+=`<div class="empty"><i class="ti ti-calendar-off"></i><div class="empty-title">${S.filterStatus==='done'?'No completed jobs':'No jobs'}</div><p>${S.isAdmin&&S.filterStatus!=='done'?'Tap + Add job to get started.':'No jobs match this filter.'}</p></div>`;
    return html;
  }

  // Expand multi-day jobs across every day in their range
  const jobMap={};
  jobs.forEach(j=>{
    const start=j.date;
    const end=(j.endDate&&j.endDate>=start)?j.endDate:start;
    let cur=new Date(start+'T00:00:00');
    const endDt=new Date(end+'T00:00:00');
    while(cur<=endDt){
      const ds=cur.toISOString().split('T')[0];
      if(!jobMap[ds])jobMap[ds]=[];
      if(!jobMap[ds].find(x=>x.id===j.id))jobMap[ds].push(j);
      cur.setDate(cur.getDate()+1);
    }
  });

  const sortedDates=Object.keys(jobMap).sort();
  let html='';
  if(conflictCount>0&&S.filterStatus!=='done')html+=`<div class="conflict-alert" style="margin-bottom:8px;"><div class="conflict-title"><i class="ti ti-alert-triangle"></i> ${conflictCount} conflict${conflictCount>1?'s':''}</div><div class="conflict-body">Double-booked technicians detected.</div></div>`;
  sortedDates.forEach(date=>{
    const dayJobs=jobMap[date].sort((a,b)=>(a.start||'').localeCompare(b.start||''));
    html+=`<div class="day-header">${fmtDateLong(date)}</div>`;
    dayJobs.forEach(j=>{ try{ html+=jobCard(j,date); }catch(e){ console.error('Skipped a malformed job card:',j.id,e); } });
  });
  return html;
}

function renderList(conflictCount){
  document.getElementById('calArea').innerHTML='';
  document.getElementById('jobsArea').innerHTML=fullJobsListHtml(conflictCount);
}

function jobCard(j, viewDate){
  const conf=isConflicted(j),techs=getTechs(j),hasEquip=j.equipment&&j.equipment.length>0,tbd=techs.length===0,done=isDone(j),inprog=isInProgress(j);
  const cls=done?'card-done':conf?'card-red':hasEquip?'card-blue':tbd?'card-amber':'card-green';
  const jobNumHtml=j.jobNum?`<div style="font-size:10px;color:var(--text-muted);font-family:'Space Mono',monospace;margin-bottom:2px;">${j.jobNum}${j.client?' · '+j.client:''}</div>`:(j.client?`<div style="font-size:10px;color:var(--text-muted);margin-bottom:2px;">${j.client}</div>`:'');
  const vehicleHtml=j.vehicle?`<span style="font-size:11px;color:var(--text-muted);margin-left:8px;"><i class="ti ti-car"></i> ${j.vehicle}</span>`:'';
  // Multi-day: show Day X/Y badge when rendering on a specific date
  const isMultiDay=j.endDate&&j.endDate!==j.date;
  let dayBadge='';
  if(isMultiDay&&viewDate&&viewDate!==j.date){
    const dayNum=Math.round((new Date(viewDate+'T00:00:00')-new Date(j.date+'T00:00:00'))/(1000*60*60*24))+1;
    const totalDays=Math.round((new Date(j.endDate+'T00:00:00')-new Date(j.date+'T00:00:00'))/(1000*60*60*24))+1;
    dayBadge=`<span class="badge badge-info" style="font-size:9px;margin-left:6px;">Day ${dayNum}/${totalDays}</span>`;
  } else if(isMultiDay&&!viewDate){
    dayBadge=`<span style="font-size:11px;color:var(--text-muted);"> (ends ${fmtDate(j.endDate)})</span>`;
  }
  return`<div class="card ${cls}" onclick="openDetail('${j.id}')">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:2px;">
      <div class="job-time" style="${done?'text-decoration:line-through;color:var(--text-muted);':''}">${fmt12(j.start)} – ${fmt12(j.end)}${dayBadge}</div>
      ${done?`<span class="badge badge-done"><i class="ti ti-check"></i> Complete</span>`:inprog?`<span class="badge badge-warn"><i class="ti ti-player-play"></i> In Progress</span>`:conf?`<span class="badge badge-danger"><i class="ti ti-alert-triangle"></i> Conflict</span>`:hasEquip?`<span class="badge badge-info"><i class="ti ti-crane"></i> Equipment</span>`:tbd?`<span class="badge badge-warn">Techs TBD</span>`:`<span class="badge badge-success"><i class="ti ti-check"></i> Scheduled</span>`}${ktStatusBadge(j)}
    </div>
    ${jobNumHtml}
    <div class="job-address">${j.address}${vehicleHtml}</div>
    <div style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:5px;">${(j.types&&j.types.length?j.types:[j.type]).filter(Boolean).map(t=>`<span class="job-type-pill">${t}</span>`).join('')}</div>
    <div class="tech-tag-row">${techs.length?techs.map(t=>`<span class="tech-tag"><i class="ti ti-user"></i>${t.split(' ')[0]}</span>`).join(''):'<span class="tech-tag tech-tag-na">TBD</span>'}</div>
    ${hasEquip&&!done?`<div style="margin-top:6px;">${j.equipment.map(e=>`<span class="equip-tag"><i class="ti ti-crane"></i>${e}</span>`).join('')}</div>`:''}
    ${S.isAdmin&&!done?`<div style="display:flex;gap:6px;margin-top:8px;" onclick="event.stopPropagation()">
      <button class="btn btn-done btn-xs" onclick="markComplete('${j.id}')"><i class="ti ti-circle-check"></i> Complete</button>
      <button class="btn btn-xs" onclick="openEmailPicker('${j.id}','${viewDate||''}')"><i class="ti ti-mail"></i> Email techs</button>
    </div>`:''}
  </div>`;
}

// NEW: tap-to-add/remove technician chips shown directly in the job detail modal
function renderModalTechChips(j,skillFilter){
  const assigned=getTechs(j);
  if(!S.techs.length)return'<span style="font-size:12px;color:var(--text-muted);">No technicians yet — add some on the Technicians tab.</span>';
  return S.techs.filter(t=>!skillFilter||(S.techSkills[t]||[]).includes(skillFilter)).map(t=>{
    const on=assigned.includes(t);
    const style=on?'':'background:var(--bg);color:var(--text-muted);border:0.5px solid var(--border-strong);';
    return`<span class="tech-tag" style="cursor:pointer;${style}" onclick="toggleJobTech('${j.id}','${t.replace(/'/g,"\\'")}')"><i class="ti ti-${on?'user-check':'user-plus'}"></i>${t}</span>`;
  }).join('')||'<span style="font-size:12px;color:var(--text-muted);">No techs match that capability.</span>';
}
window.filterModalTechChips=function(jobId){
  const j=S.jobs.find(x=>x.id===jobId);if(!j)return;
  const val=document.getElementById('modalTechCapFilter').value;
  document.getElementById('modalTechChips').innerHTML=renderModalTechChips(j,val);
};
window.toggleJobTech=async function(jobId,techName){
  const j=S.jobs.find(x=>x.id===jobId);if(!j)return;
  const techs=getTechs(j).slice();
  const idx=techs.indexOf(techName);
  if(idx>-1){techs.splice(idx,1);}
  else{
    // NEW: warn immediately if this tech is already booked elsewhere that day, before adding them
    const conflictIssues=jobConflicts({date:j.date,endDate:j.endDate,start:j.start,end:j.end,techs:[techName]},j.id);
    if(conflictIssues.length&&!confirm(`Heads up — ${techName} is already booked:\n${conflictIssues.join('\n')}\n\nAdd ${techName} to this job anyway?`))return;
    techs.push(techName);
  }
  try{await updateDoc(doc(db,'jobs',jobId),{techs});openDetail(jobId);}
  catch(e){alert('Error updating technicians.');console.error(e);}
};

    if(js!=='complete')body+=`<button class="btn btn-done btn-sm" onclick="markComplete('${id}')"><i class="ti ti-circle-check"></i> Complete</button>`;

    body+=`<div style="display:flex;gap:8px;flex-wrap:wrap;">
      <button class="btn btn-primary btn-sm" onclick="closeModal();openEdit('${id}')"><i class="ti ti-edit"></i> Edit</button>
      <button class="btn btn-danger btn-sm" onclick="delJob('${id}')"><i class="ti ti-trash"></i> Delete</button>
    </div>`;
  }

  // ── NEW: modal title shows client or address ──

window.doSearch=function(){
  const q=(document.getElementById('searchInput').value||'').toLowerCase().trim();
  const res=document.getElementById('searchResults');
  if(!q){res.innerHTML='<div class="empty"><i class="ti ti-search"></i><div class="empty-title">Start typing</div><p>Search by address, job #, client, job type, or technician name</p></div>';return;}
  const matches=S.jobs.filter(j=>{
    return j.address?.toLowerCase().includes(q)||
      (j.types?j.types.some(t=>t.toLowerCase().includes(q)):j.type?.toLowerCase().includes(q))||
      getTechs(j).some(t=>t.toLowerCase().includes(q))||
      j.notes?.toLowerCase().includes(q)||
      j.jobNum?.toLowerCase().includes(q)||
      j.client?.toLowerCase().includes(q);
  }).sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  if(!matches.length){res.innerHTML=`<div class="empty"><i class="ti ti-search-off"></i><div class="empty-title">No results</div><p>Try a different search term</p></div>`;return;}
  res.innerHTML=`<div class="search-result-label">${matches.length} result${matches.length!==1?'s':''} for "${q}"</div>`+matches.map(j=>jobCard(j)).join('');
};

window.saveJob=async function(){
  const d=document.getElementById('fDate').value,endDate=document.getElementById('fEndDate').value||d,start=document.getElementById('fStart').value,end=document.getElementById('fEnd').value;
  const address=document.getElementById('fAddr').value.trim();
  const types=getServiceTypes();
  const type=types.join(' + ')||'';
  const techs=getTechRowValues();
  const map=document.getElementById('fMap').value.trim(),notes=document.getElementById('fNotes').value.trim();
  const adminNotes=document.getElementById('fAdminNotes').value.trim();
  const equipment=Array.from(document.querySelectorAll('#equipChecks input:checked')).map(c=>c.value);
  const pickupDate=document.getElementById('fPickupDate').value,pickupTime=document.getElementById('fPickupTime').value,rentalCo=document.getElementById('fRentalCo').value.trim();
  // ── NEW fields ──
  const jobNum=document.getElementById('fJobNum').value.trim();
  const client=document.getElementById('fClient').value.trim();
  const vehicle=document.getElementById('fVehicle').value;
  const jobStatus=S.jobStatus||'scheduled';

  if(!d||!start||!end||!address||!types.length){alert('Please fill in date, time, address, and at least one service type.');return;}
  for(const t of types){if(t&&![...JOB_TYPES_DEFAULT,...JOB_TYPE_OPTIONS].includes(t)&&!S.customJobTypes.includes(t)){S.customJobTypes.push(t);await saveSettings();}}

  const existing=S.editId?S.jobs.find(x=>x.id===S.editId):null;
  const jobData={
    date:d,endDate:endDate,start,end,address,type,techs,map,notes,adminNotes,equipment,
    pickupDate:pickupDate||'',pickupTime:pickupTime||'',rentalCo:rentalCo||'',
    // ── NEW ──
    jobNum,client,vehicle,jobStatus,types,
    status:jobStatus==='complete'?'complete':'active'
  };

  try{
    if(S.editId){await updateDoc(doc(db,'jobs',S.editId),jobData);}
    else{await addDoc(collection(db,'jobs'),jobData);}
    S.editId=null;S.selectedDate=d;S.calMonth=parseInt(d.split('-')[1])-1;S.calYear=parseInt(d.split('-')[0]);showScreen('schedule');
  }catch(e){alert('Error saving. Check your connection.');console.error(e);}
};

function buildTechScheduleText(name,lang='en'){
  const t=I18N[lang];
  const today=todayStr();
  const myJobs=S.jobs.filter(j=>getTechs(j).includes(name)&&!isDone(j)&&(j.date>=today||(j.endDate&&j.endDate>=today)));
  const jobMap={};
  myJobs.forEach(j=>{
    const start=j.date||today;
    const end=(j.endDate&&j.endDate>=start)?j.endDate:start;
    let cur=new Date(start+'T00:00:00');
    const endDt=new Date(end+'T00:00:00');
    while(cur<=endDt){
      const ds=cur.toISOString().split('T')[0];
      if(ds>=today){if(!jobMap[ds])jobMap[ds]=[];if(!jobMap[ds].find(x=>x.id===j.id))jobMap[ds].push(j);}
      cur.setDate(cur.getDate()+1);
    }
  });
  const dates=Object.keys(jobMap).sort();
  if(!dates.length){
    return lang==='es'
      ?{subject:`Tu horario — nada próximo`,body:`Hola ${name.split(' ')[0]},\n\nNo tienes trabajos programados por ahora. Te avisaremos en cuanto se agende algo.\n\nGracias,\nPFBS`}
      :{subject:`Your schedule — nothing upcoming`,body:`Hi ${name.split(' ')[0]},\n\nYou have no upcoming jobs scheduled right now. We'll follow up as soon as something's booked.\n\nThanks,\nPFBS`};
  }
  let lines=lang==='es'?[`Hola ${name.split(' ')[0]},`,``,`Este es tu próximo horario:`,``]:[`Hi ${name.split(' ')[0]},`,``,`Here's your upcoming schedule:`,``];
  dates.forEach(ds=>{
    lines.push(fmtDateLongLang(ds,lang));
    jobMap[ds].forEach(j=>{
      const teammates=getTechs(j).filter(x=>x!==name);
      lines.push(`  • ${fmt12Lang(j.start,lang)}–${fmt12Lang(j.end,lang)} — ${j.address}`);
      if(j.types&&j.types.length)lines.push(`     ${t.work}: ${j.types.map(x=>trType(x,lang)).join(', ')}`);
      if(j.equipment&&j.equipment.length)lines.push(`     ${t.equipment}: ${j.equipment.map(x=>trEquip(x,lang)).join(', ')}`);
      if(teammates.length)lines.push(`     ${lang==='es'?'Con':'With'}: ${teammates.join(', ')}`);
      if(j.notes)lines.push(`     ${t.notes}: ${j.notes}`);
    });
    lines.push(``);
  });
  lines.push(t.questions,``,t.thanks,`PFBS`);
  const firstDate=fmtDateLongLang(dates[0],lang);
  return{subject:lang==='es'?`Tu horario — ${name.split(' ')[0]} — ${t.startingText} ${firstDate}`:`Your schedule — ${name.split(' ')[0]} — starting ${firstDate}`,body:lines.join('\n')};
}

function buildJobEmailText(j,lang='en',recipientTech=null,viewDate=null){
  const t=I18N[lang];
  // If we know which specific day this email is about (opened from a
  // calendar day view), show just that date — showing the job's full
  // multi-day range is what caused confusion when a tech got moved off
  // partway through. Fall back to the full range only when no specific
  // day is known (e.g. opened from search results).
  const dateStr=viewDate?fmtDateLongLang(viewDate,lang):(fmtDateLongLang(j.date,lang)+(j.endDate&&j.endDate!==j.date?' – '+fmtDateLongLang(j.endDate,lang):''));
  const allTechs=getTechs(j);
  const teamTechs=recipientTech&&recipientTech!=='ALL'?allTechs.filter(x=>x!==recipientTech):allTechs;
  const lines=[`${t.when}: ${dateStr}`,`${t.time}: ${fmt12Lang(j.start,lang)} – ${fmt12Lang(j.end,lang)}`,`${t.address}: ${j.address}`];
  if(teamTechs.length)lines.push(`${t.team}: ${teamTechs.join(', ')}`);
  if(j.types&&j.types.length)lines.push(`${t.work}: ${j.types.map(x=>trType(x,lang)).join(', ')}`);
  if(j.equipment&&j.equipment.length)lines.push(`${t.equipment}: ${j.equipment.map(x=>trEquip(x,lang)).join(', ')}`);
  if(j.notes&&String(j.notes).toLowerCase()!=='undefined')lines.push(`${t.notes}: ${j.notes}`);
  lines.push(``,t.questions,``,t.thanks,`PFBS`);
  const subjDate=viewDate||j.date;
  return{subject:lang==='es'?`Detalles del trabajo — ${j.address.split(',')[0]} — ${fmtDate(subjDate)}`:`Job details — ${j.address.split(',')[0]} — ${fmtDate(subjDate)}`,body:lines.join('\n')};
}

    <div class="card"><button class="btn btn-danger btn-sm" onclick="clearJobs()"><i class="ti ti-trash"></i> Clear all jobs</button></div>`;
}
window.removeCustomJobType=async function(i){S.customJobTypes.splice(i,1);await saveSettings();renderSettings();};
window.removeCustomEquip=async function(i){S.customEquipList.splice(i,1);await saveSettings();renderSettings();};
window.addSkillOption=async function(){
  const inp=document.getElementById('newSkillOption');const val=inp.value.trim();
  if(!val||S.skillOptions.includes(val))return;
  S.skillOptions.push(val);await saveSettings();inp.value='';renderSettings();
};
window.removeSkillOption=async function(i){
  const skill=S.skillOptions[i];
  if(!confirm(`Remove "${skill}" as a capability? It will be cleared from any tech currently tagged with it.`))return;
  S.skillOptions.splice(i,1);
  Object.keys(S.techSkills).forEach(name=>{S.techSkills[name]=(S.techSkills[name]||[]).filter(s=>s!==skill);});
  await saveSettings();renderSettings();
};
window.clearCompletedJobs=async function(){
  const done=S.jobs.filter(j=>isDone(j));
  if(!done.length){alert('No completed jobs to delete.');return;}
  if(!confirm(`Delete ${done.length} completed job${done.length!==1?'s':''}? This can't be undone.`))return;
  let failed=0;
  for(const j of done){
    try{await deleteDoc(doc(db,'jobs',j.id));}catch(e){failed++;console.error(e);}
  }
  renderSettings();
  alert(failed?`Deleted ${done.length-failed} of ${done.length}. ${failed} failed — try again.`:`Deleted ${done.length} completed job${done.length!==1?'s':''}.`);
};
window.archiveYear=function(){const blob=new Blob([JSON.stringify({year:S.year,exportedAt:new Date().toISOString(),jobs:S.jobs,techs:S.techs},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`TechSched_${S.year}_Archive.json`;a.click();};
window.newYear=async function(){if(!confirm(`Export ${S.year} and start ${S.year+1}?`))return;archiveYear();for(const j of S.jobs){try{await deleteDoc(doc(db,'jobs',j.id));}catch(e){}}S.year++;await saveSettings();alert(`${S.year} started!`);renderSchedule();renderSettings();};
window.clearJobs=async function(){if(!confirm('Delete ALL jobs permanently?'))return;for(const j of S.jobs){try{await deleteDoc(doc(db,'jobs',j.id));}catch(e){}}};

init();
</script>
